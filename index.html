<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Watch Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#EEF1F3;
    --surface:#FFFFFF;
    --surface-alt:#E4E9EC;
    --text:#161B20;
    --text-muted:#5B6670;
    --border:#D5DBDE;
    --border-strong:#BFC7CB;
    --accent:#1F8A82;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(31,138,130,0.12);
    --gold:#B0802A;
    --danger:#B23B32;
    --danger-soft:rgba(178,59,50,0.10);
    --warn:#9C6A22;
    --warn-soft:rgba(156,106,34,0.10);
    --shadow:0 1px 2px rgba(20,26,30,0.06), 0 6px 16px rgba(20,26,30,0.06);
    --radius:10px;
    --font-display:"Segoe UI",ui-sans-serif,system-ui,-apple-system,"Malgun Gothic",sans-serif;
    --font-body:"Segoe UI",ui-sans-serif,system-ui,-apple-system,"Malgun Gothic",sans-serif;
    --font-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10151A;
      --surface:#171E24;
      --surface-alt:#1E262D;
      --text:#E7ECEF;
      --text-muted:#8A97A0;
      --border:#2A333A;
      --border-strong:#3A454D;
      --accent:#3FB6A9;
      --accent-ink:#08201D;
      --accent-soft:rgba(63,182,169,0.16);
      --gold:#D6A94A;
      --danger:#E17167;
      --danger-soft:rgba(225,113,103,0.14);
      --warn:#DBA35B;
      --warn-soft:rgba(219,163,91,0.14);
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10151A;
    --surface:#171E24;
    --surface-alt:#1E262D;
    --text:#E7ECEF;
    --text-muted:#8A97A0;
    --border:#2A333A;
    --border-strong:#3A454D;
    --accent:#3FB6A9;
    --accent-ink:#08201D;
    --accent-soft:rgba(63,182,169,0.16);
    --gold:#D6A94A;
    --danger:#E17167;
    --danger-soft:rgba(225,113,103,0.14);
    --warn:#DBA35B;
    --warn-soft:rgba(219,163,91,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.45;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  /* ---- Header ---- */
  header.top{
    display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between;
    margin-bottom:22px;
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:26px;
    letter-spacing:-0.02em;
    margin:0 0 2px;
    text-wrap:balance;
  }
  .brand p{
    margin:0;color:var(--text-muted);font-size:13px;
  }
  .stats{
    display:flex;flex-wrap:wrap;gap:12px 16px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  }
  .stat{text-align:right;}
  .stat b{display:block;font-size:19px;color:var(--text);}
  .stat span{display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}

  /* ---- Sync status ---- */
  .sync-row{
    display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;
  }
  .sync-pill{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;letter-spacing:.02em;
    padding:5px 10px;border-radius:999px;border:1px solid var(--border);
    color:var(--text-muted);background:var(--surface);
  }
  .sync-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);flex:none;}
  .sync-pill.ok{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft);}
  .sync-pill.ok .dot{background:var(--accent);}
  .sync-pill.warn{color:var(--warn);border-color:var(--warn-soft);background:var(--warn-soft);}
  .sync-pill.warn .dot{background:var(--warn);}
  .sync-pill.err{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft);}
  .sync-pill.err .dot{background:var(--danger);}
  .sync-pill .dot{animation:pulse 1.6s ease-in-out infinite;}
  .sync-pill:not(.busy) .dot{animation:none;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .sync-note{font-size:12px;color:var(--text-muted);}
  .sync-note button{
    border:none;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline;
  }

  /* ---- Toolbar ---- */
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;
  }
  input,select,textarea,button{font-family:var(--font-body);font-size:14px;color:var(--text);}
  .search{
    flex:1 1 220px;
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:9px 12px;
  }
  .search input{flex:1;border:none;background:transparent;outline:none;color:var(--text);}
  .search svg{flex:none;color:var(--text-muted);}
  .btn{
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    border-radius:var(--radius);padding:9px 14px;cursor:pointer;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn:hover{border-color:var(--border-strong);}
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--danger);}
  .btn:disabled{opacity:.5;cursor:default;}

  /* ---- View bar: status filter + grouping ---- */
  .viewbar{
    display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:20px;
  }
  .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .fchip{
    border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
    border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;
  }
  .fchip:hover{border-color:var(--border-strong);}
  .fchip .n{
    font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:11px;
    color:var(--text-muted);background:var(--bg);border-radius:999px;padding:0 5px;
  }
  .fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .fchip.on .n{background:rgba(255,255,255,0.22);color:inherit;}
  .fchip.empty:not(.on){opacity:.55;}
  .groupby{
    margin-left:auto;display:inline-flex;align-items:center;gap:7px;
    font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);
  }
  .groupby select{
    background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:5px 8px;color:var(--text);
    font-size:13px;font-weight:600;letter-spacing:normal;text-transform:none;
  }

  /* ---- Groups ---- */
  .group{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;
  }
  .group-head{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 16px;background:var(--surface-alt);border-bottom:1px solid var(--border);
  }
  .group-head .name{
    font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.01em;
    display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:none;color:var(--text);padding:0;
  }
  .group-head .name .chev{transition:transform .15s ease;color:var(--text-muted);}
  .group.collapsed .group-head .name .chev{transform:rotate(-90deg);}
  .count{
    font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-muted);
    background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:1px 8px;
  }
  .sort-controls{display:flex;align-items:center;gap:6px;margin-left:auto;}
  .sort-controls select{
    background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:5px 8px;color:var(--text);
  }
  .sort-dir{
    border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:5px 8px;cursor:pointer;color:var(--text-muted);
    display:inline-flex;
  }
  .sort-dir svg{transition:transform .15s ease;}
  .sort-dir.desc svg{transform:rotate(180deg);}

  .rows{display:flex;flex-direction:column;}
  .group.collapsed .rows{display:none;}

  .row{
    display:grid;
    grid-template-columns:auto 1fr auto auto;
    align-items:center;
    gap:14px;
    padding:11px 16px;
    border-top:1px solid var(--border);
    position:relative;
  }
  .row:first-child{border-top:none;}
  .row.st-done{background:color-mix(in srgb, var(--accent-soft) 55%, transparent);}
  .row.st-dropped .info .title{text-decoration:line-through;text-decoration-color:var(--border-strong);}

  .status-btn{
    height:24px;border-radius:999px;border:1.6px solid var(--border-strong);background:var(--surface);
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex:none;
    padding:0 10px;min-width:92px;font-size:11.5px;font-weight:700;color:var(--text-muted);
  }
  .status-btn .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
  .row.st-watching .status-btn{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);}
  .row.st-done .status-btn{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);}
  .row.st-dropped .status-btn{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);}

  .progress{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);
    font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  }
  .progress .bar{
    width:46px;height:5px;border-radius:999px;background:var(--surface-alt);
    border:1px solid var(--border);overflow:hidden;
  }
  .progress .bar i{display:block;height:100%;background:var(--accent);}

  .info{min-width:0;}
  .info .title{font-weight:700;font-size:14.5px;overflow-wrap:anywhere;}
  .info .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;align-items:center;}
  .chip{
    font-size:11.5px;color:var(--text-muted);background:var(--surface-alt);border:1px solid var(--border);
    border-radius:6px;padding:2px 7px;
  }
  .notes-preview{
    font-size:12.5px;color:var(--text-muted);margin-top:4px;overflow-wrap:anywhere;
  }

  .divider{
    align-self:stretch;width:0;border-left:1.5px dashed var(--border-strong);
  }

  .stub{
    display:flex;flex-direction:column;align-items:flex-end;gap:3px;
    font-family:var(--font-mono);font-variant-numeric:tabular-nums;
    min-width:104px;
  }
  .stub .dates{font-size:11px;color:var(--text-muted);text-align:right;}
  .stub .rank{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--gold);font-weight:700;}
  .stub .rank svg{width:13px;height:13px;}
  .stub .rank.empty{color:var(--text-muted);font-weight:400;}

  .row-actions{display:flex;gap:4px;}
  .icon-btn{
    border:none;background:none;color:var(--text-muted);cursor:pointer;padding:4px;border-radius:6px;display:flex;
  }
  .icon-btn:hover{background:var(--surface-alt);color:var(--text);}

  .empty-state{
    padding:34px 20px;text-align:center;color:var(--text-muted);font-size:13.5px;
  }
  .empty-state.small{padding:20px;}

  @media (max-width:640px){
    .row{grid-template-columns:auto 1fr;}
    .divider{display:none;}
    .stub{align-items:flex-start;flex-direction:row;flex-wrap:wrap;grid-column:2;justify-content:space-between;min-width:0;}
    .row-actions{grid-column:2;justify-content:flex-end;}
  }

  /* ---- Modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,13,16,0.5);display:flex;align-items:flex-start;justify-content:center;
    padding:6vh 16px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
    width:100%;max-width:520px;padding:22px;
  }
  .modal h2{margin:0 0 16px;font-family:var(--font-display);font-size:18px;font-weight:800;}
  .field{margin-bottom:13px;display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
  .field input,.field select,.field textarea{
    border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:9px 10px;color:var(--text);width:100%;
  }
  .field textarea{resize:vertical;min-height:64px;font-family:var(--font-body);}
  .star-picker{
    display:flex;gap:8px;outline:none;
  }
  .star-picker:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px;}
  .star-picker .star{
    position:relative;width:36px;height:36px;padding:0;border:none;background:none;cursor:pointer;flex:none;display:inline-block;
  }
  .star-picker .star svg{position:absolute;top:0;left:0;width:36px;height:36px;display:block;}
  .star-picker .star .bg svg{color:var(--border-strong);}
  .star-picker .star .fg svg{color:var(--gold);clip-path:inset(0 100% 0 0);}
  .star-picker .star.half .fg svg{clip-path:inset(0 50% 0 0);}
  .star-picker .star.full .fg svg{clip-path:inset(0 0 0 0);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .ep-inputs{display:flex;align-items:center;gap:6px;}
  .ep-inputs span{color:var(--text-muted);font-size:13px;}
  .modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;}
  .modal-actions .right{display:flex;gap:8px;}
  .backup{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);}
  .backup-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-right:auto;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;
    box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Watch Log</h1>
      <p>Dramas &amp; movies, checked off as you go.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="statWatching">0</b><span>Watching</span></div>
      <div class="stat"><b id="statDone">0</b><span>Done</span></div>
      <div class="stat"><b id="statTotal">0</b><span>Total</span></div>
      <div class="stat"><b id="statAvg">–</b><span>Avg rank</span></div>
    </div>
  </header>

  <div class="sync-row">
    <span class="sync-pill" id="syncPill"><span class="dot"></span><span id="syncLabel">Starting…</span></span>
    <span class="sync-note" id="syncNote"></span>
    <button class="btn ghost" id="syncSettingsBtn" style="margin-left:auto;" title="GitHub sync settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Sync
    </button>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search title, genre, notes…" aria-label="Search">
    </div>
    <button class="btn ghost" id="refreshBtn" title="Pull latest from GitHub">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 4v6h-6"/></svg>
      Refresh
    </button>
    <button class="btn primary" id="addBtn">+ Add title</button>
  </div>

  <div class="viewbar">
    <div class="filters" id="statusFilters" role="group" aria-label="Filter by status"></div>
    <label class="groupby">Group by
      <select id="groupBySelect" aria-label="Group titles by"></select>
    </label>
  </div>

  <div id="groups"></div>
</div>

<div class="toast" id="toast"></div>

<template id="modalTemplate">
  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Add title</h2>
      <form id="entryForm">
        <div class="field">
          <label for="f-title">Title</label>
          <input type="text" id="f-title" required autocomplete="off">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-mediaType">Type</label>
            <select id="f-mediaType">
              <option value="">Select…</option>
              <option value="Drama">Drama</option>
              <option value="Movie">Movie</option>
              <option value="Anime">Anime</option>
              <option value="Documentary">Documentary</option>
              <option value="Variety Show">Variety Show</option>
              <option value="Web Series">Web Series</option>
            </select>
          </div>
          <div class="field">
            <label for="f-genre">Genre</label>
            <select id="f-genre">
              <option value="">Select…</option>
              <option value="Romance">Romance</option>
              <option value="Comedy">Comedy</option>
              <option value="Action">Action</option>
              <option value="Thriller">Thriller</option>
              <option value="Mystery">Mystery</option>
              <option value="Crime">Crime</option>
              <option value="Melodrama">Melodrama</option>
              <option value="Fantasy">Fantasy</option>
              <option value="Horror">Horror</option>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Historical">Historical</option>
              <option value="Slice of Life">Slice of Life</option>
              <option value="Family">Family</option>
              <option value="Music">Music</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-status">Status</label>
            <select id="f-status">
              <option value="planned">To watch</option>
              <option value="watching">Watching</option>
              <option value="done">Done</option>
              <option value="dropped">Dropped</option>
            </select>
          </div>
          <div class="field">
            <label for="f-epWatched">Episodes</label>
            <div class="ep-inputs">
              <input type="number" id="f-epWatched" min="0" step="1" inputmode="numeric" placeholder="seen" aria-label="Episodes watched">
              <span>/</span>
              <input type="number" id="f-epTotal" min="0" step="1" inputmode="numeric" placeholder="total" aria-label="Episodes in total">
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-startedDate">Started</label>
            <input type="date" id="f-startedDate">
          </div>
          <div class="field">
            <label for="f-watchedDate">Finished</label>
            <input type="date" id="f-watchedDate">
          </div>
        </div>
        <div class="field">
          <label>Rank <span style="text-transform:none;font-weight:400;">(0–10, click to set)</span></label>
          <div class="star-picker" id="f-rank-picker" role="radiogroup" aria-label="Rank" tabindex="0"></div>
        </div>
        <div class="field">
          <label for="f-notes">Notes / review</label>
          <textarea id="f-notes" placeholder="Your take on it…"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn danger ghost" id="deleteBtn" style="display:none;">Delete</button>
          <div class="right">
            <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn primary">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</template>

<script>
(function(){
  "use strict";

  var GIST_FILENAME = "drama-tracker-data.json";
  var GH_API = "https://api.github.com";
  var SORT_FIELDS = [
    {key:"title", label:"Title"},
    {key:"status", label:"Status"},
    {key:"mediaType", label:"Type"},
    {key:"genre", label:"Genre"},
    {key:"startedDate", label:"Started"},
    {key:"watchedDate", label:"Finished"},
    {key:"rank", label:"Rank"}
  ];

  // Cycling order of the row chip, and the order "sort by status" uses.
  var STATUSES = [
    {key:"planned",  label:"To watch"},
    {key:"watching", label:"Watching"},
    {key:"done",     label:"Done"},
    {key:"dropped",  label:"Dropped"}
  ];
  var STATUS_INDEX = {};
  var STATUS_LABEL_INDEX = {};
  STATUSES.forEach(function(s, i){ STATUS_INDEX[s.key] = i; STATUS_LABEL_INDEX[s.label] = i; });

  // What the rows can be grouped by. "status" groups on the derived status label, the others on
  // a plain entry field.
  var GROUP_FIELDS = [
    {key:"mediaType", label:"Type"},
    {key:"status",    label:"Status"},
    {key:"genre",     label:"Genre"}
  ];
  var GROUP_KEYS = GROUP_FIELDS.map(function(f){ return f.key; });

  var state = {
    entries: [],
    mode: "init", // init | github | local
    search: "",
    filter: "all",   // "all" or a status key
    groupBy: "mediaType",
    groupState: {},  // "<groupBy>:<group key>" -> {collapsed, sortKey, sortDir}
    saving: false,
    pendingSave: false,
    gistVersion: null
  };

  // ---------- utils ----------
  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtDate(d){
    if (!d) return "—";
    return d;
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }

  // ---------- storage payload ----------
  // v1 stored a bare array. v2 wraps it as {version:2, entries:[…]} so the format can be
  // migrated later; both shapes are accepted on read.
  var SCHEMA_VERSION = 2;

  function serializePayload(entries, pretty){
    var payload = {version: SCHEMA_VERSION, entries: entries};
    return pretty ? JSON.stringify(payload, null, 2) : JSON.stringify(payload);
  }
  // Returns a clean array of entries, or null if the text isn't a readable payload.
  function parsePayload(raw){
    if (raw == null || raw === "") return null;
    var data;
    try{ data = JSON.parse(raw); }catch(e){ return null; }
    var list = Array.isArray(data) ? data
      : (data && Array.isArray(data.entries) ? data.entries : null);
    if (!list) return null;
    return list.filter(function(e){
      return e && typeof e === "object" && typeof e.title === "string" && e.title.trim() !== "";
    }).map(function(e){
      if (!e.id) e.id = uid();
      return normalizeEntry(e);
    });
  }

  // How the list is laid out (filter, grouping, per-group collapse/sort) is a per-device view
  // preference, so it lives in its own localStorage key and never travels to the gist with the
  // entries. Anything unrecognised on read falls back to the default.
  var VIEW_KEY = "watchlog:view";
  var DEFAULT_SORT_KEY = "watchedDate";
  var DEFAULT_SORT_DIR = "desc";
  var SORT_KEYS = SORT_FIELDS.map(function(f){ return f.key; });

  function isDefaultGroupState(gs){
    return !gs.collapsed && gs.sortKey === DEFAULT_SORT_KEY && gs.sortDir === DEFAULT_SORT_DIR;
  }
  function viewSave(){
    var kept = {};
    Object.keys(state.groupState).forEach(function(k){
      if (!isDefaultGroupState(state.groupState[k])) kept[k] = state.groupState[k];
    });
    try{
      localStorage.setItem(VIEW_KEY, JSON.stringify({
        filter: state.filter, groupBy: state.groupBy, groupState: kept
      }));
    }catch(e){}
  }
  function viewLoad(){
    var v;
    try{ v = JSON.parse(localStorage.getItem(VIEW_KEY) || "null"); }catch(e){ return; }
    if (!v || typeof v !== "object") return;
    if (v.filter === "all" || STATUS_INDEX[v.filter] != null) state.filter = v.filter;
    if (GROUP_KEYS.indexOf(v.groupBy) !== -1) state.groupBy = v.groupBy;
    if (v.groupState && typeof v.groupState === "object"){
      Object.keys(v.groupState).forEach(function(k){
        var gs = v.groupState[k];
        if (!gs || typeof gs !== "object") return;
        state.groupState[k] = {
          collapsed: !!gs.collapsed,
          sortKey: SORT_KEYS.indexOf(gs.sortKey) !== -1 ? gs.sortKey : DEFAULT_SORT_KEY,
          sortDir: gs.sortDir === "asc" ? "asc" : DEFAULT_SORT_DIR
        };
      });
    }
  }

  function localSave(){
    try{ localStorage.setItem("watchlog:entries", serializePayload(state.entries)); }catch(e){}
  }
  function localLoad(){
    try{ return parsePayload(localStorage.getItem("watchlog:entries")); }catch(e){ return null; }
  }

  // ---------- status & episodes ----------
  // v1 only had a `watched` flag. `status` is the source of truth now, but `watched` is kept in
  // step with it so a device still running an older cached copy of the app still reads finished
  // titles correctly.
  function today(){ return new Date().toISOString().slice(0,10); }

  function numOrNull(v){
    if (v === "" || v == null) return null;
    var n = Number(v);
    return isFinite(n) && n >= 0 ? Math.floor(n) : null;
  }

  function statusOf(entry){
    if (entry.status && STATUS_INDEX[entry.status] != null) return entry.status;
    return entry.watched ? "done" : "planned";
  }

  function statusLabel(key){
    return (STATUSES[STATUS_INDEX[key]] || STATUSES[0]).label;
  }

  function applyStatus(entry, key){
    entry.status = key;
    entry.watched = (key === "done");
    if (key === "watching" && !entry.startedDate) entry.startedDate = today();
    if (key === "done" && !entry.watchedDate) entry.watchedDate = today();
    return entry;
  }

  function normalizeEntry(entry){
    entry.status = statusOf(entry);
    entry.watched = (entry.status === "done");
    entry.episodesTotal = numOrNull(entry.episodesTotal);
    entry.episodesWatched = numOrNull(entry.episodesWatched);
    return entry;
  }

  // ---------- merge ----------
  // Every edit stamps updatedAt, and a delete leaves a tombstone (deletedAt) instead of dropping
  // the row, so a merge can tell "deleted here" from "never seen here". Entries written before
  // these fields existed have no updatedAt; they compare as oldest and lose to any stamped copy.
  var TOMBSTONE_TTL_MS = 90 * 24 * 60 * 60 * 1000;

  function nowISO(){ return new Date().toISOString(); }

  function touch(entry){
    entry.updatedAt = nowISO();
    if (!entry.createdAt) entry.createdAt = entry.updatedAt;
    return entry;
  }

  function liveEntries(){
    return state.entries.filter(function(e){ return !e.deletedAt; });
  }

  // Later updatedAt wins; on a tie the first argument (the local copy) stays put.
  function newerOf(mine, theirs){
    return (theirs.updatedAt || "") > (mine.updatedAt || "") ? theirs : mine;
  }

  function mergeEntries(mine, theirs){
    var byId = {}, order = [];
    function absorb(list){
      (list || []).forEach(function(e){
        if (!e || !e.id) return;
        if (!byId[e.id]){ byId[e.id] = e; order.push(e.id); return; }
        byId[e.id] = newerOf(byId[e.id], e);
      });
    }
    absorb(mine);
    absorb(theirs);
    return order.map(function(id){ return byId[id]; });
  }

  // Order-independent fingerprint: what this set knows, and how fresh each part is.
  function signature(entries){
    return (entries || []).map(function(e){ return e.id + "@" + (e.updatedAt || ""); }).sort().join("|");
  }

  function gistVersionOf(gist){
    return (gist && gist.history && gist.history[0] && gist.history[0].version) || null;
  }

  function gistBody(){
    var body = {files: {}};
    body.files[GIST_FILENAME] = {content: serializePayload(state.entries, true)};
    return body;
  }

  // Tombstones only need to outlive the other devices' caches.
  function purgeTombstones(entries){
    var cutoff = Date.now() - TOMBSTONE_TTL_MS;
    return entries.filter(function(e){
      if (!e.deletedAt) return true;
      var t = Date.parse(e.deletedAt);
      return isNaN(t) || t >= cutoff;
    });
  }

  // ---------- sync status UI ----------
  function setSync(kind, label, note, busy){
    var pill = document.getElementById("syncPill");
    pill.className = "sync-pill" + (kind ? " " + kind : "") + (busy ? " busy" : "");
    document.getElementById("syncLabel").textContent = label;
    var noteEl = document.getElementById("syncNote");
    noteEl.innerHTML = "";
    if (note) noteEl.appendChild(note);
  }
  function noteText(s){ var span=document.createElement("span"); span.textContent=s; return span; }
  function noteRetry(s, fn, label){
    var span = document.createElement("span");
    span.textContent = s + " ";
    var btn = document.createElement("button");
    btn.textContent = label || "Retry";
    btn.onclick = fn;
    span.appendChild(btn);
    return span;
  }

  // ---------- token storage ----------
  function getToken(){ try{ return localStorage.getItem("watchlog:ghtoken"); }catch(e){ return null; } }
  function setToken(t){ try{ t ? localStorage.setItem("watchlog:ghtoken", t) : localStorage.removeItem("watchlog:ghtoken"); }catch(e){} }
  function getGistId(){ try{ return localStorage.getItem("watchlog:gistid"); }catch(e){ return null; } }
  function setGistId(id){ try{ id ? localStorage.setItem("watchlog:gistid", id) : localStorage.removeItem("watchlog:gistid"); }catch(e){} }

  // ---------- GitHub Gist persistence ----------
  var sync = {
    init(){
      if (!getToken()){
        state.mode = "local";
        return false;
      }
      state.mode = "github";
      return true;
    },

    async ghFetch(path, options){
      options = options || {};
      var headers = Object.assign({
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        "Authorization": "token " + getToken()
      }, options.headers || {});
      var res = await fetch(GH_API + path, Object.assign({}, options, {headers: headers}));
      if (!res.ok){
        var body = null;
        try{ body = await res.json(); }catch(e){}
        var err = new Error((body && body.message) || ("GitHub API error " + res.status));
        err.status = res.status;
        throw err;
      }
      if (res.status === 204) return null;
      return res.json();
    },

    async findGist(){
      for (var page=1; page<=5; page++){
        var list = await sync.ghFetch("/gists?per_page=100&page=" + page);
        if (!list || !list.length) break;
        var hit = list.find(function(g){ return g.files && g.files[GIST_FILENAME]; });
        if (hit) return hit.id;
        if (list.length < 100) break;
      }
      return null;
    },

    async load(){
      setSync("", "Loading…", null, true);
      try{
        var id = getGistId();
        if (!id){
          id = await sync.findGist();
          if (id) setGistId(id);
        }
        if (!id){
          state.entries = purgeTombstones(localLoad() || []);
          setSync("ok", "Synced", noteText("First time here — add a title to start."), false);
          return;
        }
        var gist = await sync.ghFetch("/gists/" + id);
        state.gistVersion = gistVersionOf(gist);
        var remote = parsePayload(await sync.readGistFile(gist)) || [];
        var local = localLoad() || state.entries || [];
        state.entries = purgeTombstones(mergeEntries(local, remote));
        localSave();
        setSync("ok", "Synced", null, false);
        // Whatever this device knows that the gist doesn't has to go back up — otherwise an edit
        // made while offline disappears the next time any device saves.
        if (signature(state.entries) !== signature(remote)) await sync.save();
      }catch(err){
        sync.handleError(err, "load");
        state.entries = purgeTombstones(localLoad() || state.entries || []);
      }
    },

    async readGistFile(gist){
      var file = gist && gist.files && gist.files[GIST_FILENAME];
      if (!file) return null;
      return file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
    },

    async save(){
      if (state.mode !== "github"){ localSave(); return; }
      if (state.saving){ state.pendingSave = true; return; }
      state.saving = true;
      setSync("warn", "Saving…", null, true);
      try{
        var id = getGistId();
        var result;
        if (id){
          // A gist PATCH replaces the whole file, so if another device wrote since we last read,
          // fold its version in first instead of flattening it.
          var current = await sync.ghFetch("/gists/" + id);
          if (gistVersionOf(current) !== state.gistVersion){
            var theirs = parsePayload(await sync.readGistFile(current));
            if (theirs){
              state.entries = purgeTombstones(mergeEntries(state.entries, theirs));
              localSave();
              render();
            }
          }
          result = await sync.ghFetch("/gists/" + id, {method:"PATCH", body: JSON.stringify(gistBody())});
        } else {
          var body = gistBody();
          body.description = "Watch Log data (auto-synced by the app — don't rename the file)";
          body.public = false;
          result = await sync.ghFetch("/gists", {method:"POST", body: JSON.stringify(body)});
          setGistId(result.id);
        }
        state.gistVersion = gistVersionOf(result);
        localSave();
        setSync("ok", "Synced", null, false);
      }catch(err){
        sync.handleError(err, "save");
        localSave();
      }finally{
        state.saving = false;
        if (state.pendingSave){
          state.pendingSave = false;
          sync.save();
        }
      }
    },

    handleError(err, ctx){
      var status = err && err.status;
      if (status === 401){
        setSync("err", "Reconnect needed", noteRetry("Token is invalid or expired.", openSyncModal, "Reconnect"), false);
      } else if (status === 404){
        setGistId(null);
        setSync("warn", ctx === "save" ? "Save didn't confirm" : "Couldn't find sync file", noteRetry("Working from the local copy on this device.", function(){
          ctx === "save" ? sync.save() : sync.load();
        }), false);
      } else if (status === 403){
        setSync("err", "Rate limited", noteText("GitHub API rate limit hit — try again shortly."), false);
      } else {
        setSync("warn", ctx === "save" ? "Save didn't confirm" : "Couldn't reach GitHub", noteRetry("Working from the local copy on this device.", function(){
          ctx === "save" ? sync.save() : sync.load();
        }), false);
      }
    }
  };

  // ---------- sync settings modal ----------
  function openSyncModal(){
    var hasToken = !!getToken();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="syncModalTitle">' +
        '<h2 id="syncModalTitle">GitHub sync</h2>' +
        '<div class="field">' +
          '<label for="gh-token">Personal access token</label>' +
          '<input type="password" id="gh-token" autocomplete="off" placeholder="' + (hasToken ? "Enter a new token to replace the saved one" : "ghp_…") + '">' +
        '</div>' +
        '<p style="font-size:12.5px;color:var(--text-muted);margin:-4px 0 14px;">' +
          'Needs only the <code>gist</code> scope — nothing else. Give it an expiry (90 days). ' +
          '<a href="https://github.com/settings/tokens/new?scopes=gist&description=Watch+Log+sync" target="_blank" rel="noopener" style="color:var(--accent);">Create one on GitHub</a> — stored only in this browser, never committed to the repo.' +
        '</p>' +
        '<p style="font-size:12.5px;color:var(--text-muted);margin:-8px 0 14px;">' +
          'Keep the scope to <code>gist</code> alone: every page under <code>miel4ru-web.github.io</code> shares one browser origin, ' +
          'so any app hosted there can read a token saved here.' +
        '</p>' +
        '<div class="backup">' +
          '<span class="backup-label">Backup</span>' +
          '<button type="button" class="btn ghost" id="exportBtn">Export JSON</button>' +
          '<button type="button" class="btn ghost" id="importBtn">Import JSON</button>' +
          '<input type="file" id="importFile" accept="application/json,.json" style="display:none;">' +
        '</div>' +
        '<p style="font-size:12.5px;color:var(--text-muted);margin:8px 0 0;">' +
          'Import only adds: a title already here is left untouched, so restoring a backup can never overwrite what you have.' +
        '</p>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn danger ghost" id="ghDisconnectBtn" style="' + (hasToken ? "" : "display:none;") + '">Disconnect</button>' +
          '<div class="right">' +
            '<button type="button" class="btn ghost" id="ghCancelBtn">Cancel</button>' +
            '<button type="button" class="btn primary" id="ghConnectBtn">' + (hasToken ? "Save" : "Connect") + '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);

    function close(){ overlay.remove(); }
    overlay.addEventListener("click", function(ev){ if (ev.target === overlay) close(); });
    document.addEventListener("keydown", function esc(ev){
      if (ev.key === "Escape"){ close(); document.removeEventListener("keydown", esc); }
    });
    overlay.querySelector("#ghCancelBtn").addEventListener("click", close);

    overlay.querySelector("#ghDisconnectBtn").addEventListener("click", function(){
      setToken(null);
      setGistId(null);
      state.mode = "local";
      close();
      setSync("warn", "Local only", noteRetry("Connect GitHub to sync across devices.", openSyncModal, "Connect"), false);
      toast("Disconnected");
    });

    overlay.querySelector("#ghConnectBtn").addEventListener("click", function(){
      var val = document.getElementById("gh-token").value.trim();
      if (!val){
        if (hasToken){ close(); return; }
        toast("Enter a token first");
        return;
      }
      setToken(val);
      close();
      sync.init();
      sync.load().then(render);
      toast("Connecting…");
    });

    overlay.querySelector("#exportBtn").addEventListener("click", function(){
      var blob = new Blob([serializePayload(state.entries, true)], {type: "application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "watchlog-" + new Date().toISOString().slice(0,10) + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
      var n = liveEntries().length;
      toast("Exported " + n + (n === 1 ? " title" : " titles"));
    });

    var fileInput = overlay.querySelector("#importFile");
    overlay.querySelector("#importBtn").addEventListener("click", function(){ fileInput.click(); });
    fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onerror = function(){ toast("Couldn't read that file"); };
      reader.onload = function(){
        var incoming = parsePayload(reader.result);
        if (incoming) incoming = incoming.filter(function(e){ return !e.deletedAt; });
        fileInput.value = "";
        if (!incoming){ toast("That file isn't a Watch Log backup"); return; }
        var seen = {};
        state.entries.forEach(function(e){ seen[e.id] = true; });
        var added = 0;
        incoming.forEach(function(e){
          if (seen[e.id]) return;
          seen[e.id] = true;
          state.entries.push(e);
          added++;
        });
        close();
        render();
        if (added) sync.save();
        toast(added
          ? "Imported " + added + " of " + incoming.length
          : "Nothing new — all " + incoming.length + " already here");
      };
      reader.readAsText(file);
    });

    setTimeout(function(){ document.getElementById("gh-token").focus(); }, 0);
  }

  // ---------- rendering ----------
  function searchMatched(all){
    var q = state.search.trim().toLowerCase();
    if (!q) return all;
    return all.filter(function(e){
      return [e.title, e.genre, e.mediaType, e.notes].some(function(f){
        return (f||"").toLowerCase().indexOf(q) !== -1;
      });
    });
  }

  function groupKeyOf(e){
    if (state.groupBy === "status") return statusLabel(statusOf(e));
    var v = String(e[state.groupBy] == null ? "" : e[state.groupBy]).trim();
    return v || (state.groupBy === "genre" ? "No genre" : "Uncategorized");
  }

  function groupBy(entries){
    var groups = {};
    entries.forEach(function(e){
      var key = groupKeyOf(e);
      if (!groups[key]) groups[key] = [];
      groups[key].push(e);
    });
    return groups;
  }

  // Status groups read in watch order, not alphabetically.
  function groupKeys(groups){
    var keys = Object.keys(groups);
    if (state.groupBy === "status"){
      return keys.sort(function(a,b){ return STATUS_LABEL_INDEX[a] - STATUS_LABEL_INDEX[b]; });
    }
    return keys.sort(function(a,b){ return a.localeCompare(b); });
  }

  // Collapse/sort is remembered per grouping mode: "Drama" as a type and "Drama" as a genre are
  // different groups and must not share one state.
  function getGroupState(key){
    var k = state.groupBy + ":" + key;
    if (!state.groupState[k]){
      state.groupState[k] = {collapsed:false, sortKey:DEFAULT_SORT_KEY, sortDir:DEFAULT_SORT_DIR};
    }
    return state.groupState[k];
  }

  function sortEntries(list, gs){
    var mult = gs.sortDir === "asc" ? 1 : -1;
    return list.slice().sort(function(a,b){
      var av = a[gs.sortKey], bv = b[gs.sortKey];
      if (gs.sortKey === "status"){
        return (STATUS_INDEX[statusOf(a)] - STATUS_INDEX[statusOf(b)]) * mult;
      }
      if (gs.sortKey === "rank"){
        av = av == null ? -Infinity : av;
        bv = bv == null ? -Infinity : bv;
        return (av - bv) * mult;
      }
      av = av || "";
      bv = bv || "";
      if (av < bv) return -1 * mult;
      if (av > bv) return 1 * mult;
      return 0;
    });
  }

  function starIcon(){
    return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.7l-6 3.3 1.3-6.8-5-4.7 6.8-.8z"/></svg>';
  }
  function chevIcon(){
    return '<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>';
  }
  function arrowIcon(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
  }

  // ---------- star rating picker ----------
  function renderStarPicker(container, getValue, setValue){
    var stars = "";
    for (var i=1;i<=5;i++){
      stars += '<button type="button" class="star" data-value="'+i+'" aria-label="'+(i*2)+' of 10">' +
        '<span class="bg">'+starIcon()+'</span><span class="fg">'+starIcon()+'</span></button>';
    }
    container.innerHTML = stars;
    updateStarPickerDisplay(container, getValue());

    container.onclick = function(ev){
      var btn = ev.target.closest(".star");
      if (!btn) return;
      var rect = btn.getBoundingClientRect();
      var i = parseInt(btn.getAttribute("data-value"), 10);
      var half = (ev.clientX - rect.left) < rect.width / 2;
      var newVal = half ? i*2 - 1 : i*2;
      if (getValue() === newVal) newVal = null;
      setValue(newVal);
      updateStarPickerDisplay(container, getValue());
    };
    container.onmousemove = function(ev){
      var btn = ev.target.closest(".star");
      if (!btn){ updateStarPickerDisplay(container, getValue()); return; }
      var rect = btn.getBoundingClientRect();
      var i = parseInt(btn.getAttribute("data-value"), 10);
      var half = (ev.clientX - rect.left) < rect.width / 2;
      updateStarPickerDisplay(container, half ? i*2 - 1 : i*2);
    };
    container.onmouseleave = function(){
      updateStarPickerDisplay(container, getValue());
    };
    container.onkeydown = function(ev){
      var cur = getValue();
      if (ev.key === "ArrowRight" || ev.key === "ArrowUp"){
        ev.preventDefault();
        setValue(Math.min(10, (cur == null ? 0 : cur) + 1));
      } else if (ev.key === "ArrowLeft" || ev.key === "ArrowDown"){
        ev.preventDefault();
        var nv = (cur == null ? 10 : cur) - 1;
        setValue(nv < 0 ? null : nv);
      } else if (ev.key === "Home"){
        ev.preventDefault();
        setValue(null);
      } else if (ev.key === "End"){
        ev.preventDefault();
        setValue(10);
      } else {
        return;
      }
      updateStarPickerDisplay(container, getValue());
    };
  }
  function updateStarPickerDisplay(container, value){
    container.querySelectorAll(".star").forEach(function(btn){
      var i = parseInt(btn.getAttribute("data-value"), 10);
      btn.classList.remove("full", "half");
      if (value != null){
        if (value >= i*2) btn.classList.add("full");
        else if (value === i*2 - 1) btn.classList.add("half");
      }
    });
    container.setAttribute("aria-valuenow", value == null ? "" : value);
  }

  // Counts are of the search result, so the chips show how the current search breaks down.
  function renderFilters(pool){
    var counts = {all: pool.length};
    STATUSES.forEach(function(s){ counts[s.key] = 0; });
    pool.forEach(function(e){ counts[statusOf(e)]++; });
    var items = [{key:"all", label:"All"}].concat(STATUSES);
    document.getElementById("statusFilters").innerHTML = items.map(function(it){
      var on = state.filter === it.key;
      return '<button type="button" class="fchip' + (on ? " on" : "") +
        (counts[it.key] ? "" : " empty") + '" data-filter="' + it.key +
        '" aria-pressed="' + (on ? "true" : "false") + '">' + escapeHtml(it.label) +
        '<span class="n">' + counts[it.key] + '</span></button>';
    }).join("");
  }

  function render(){
    var container = document.getElementById("groups");
    var live = liveEntries();
    var pool = searchMatched(live);
    renderFilters(pool);
    document.getElementById("groupBySelect").value = state.groupBy;

    var entries = state.filter === "all"
      ? pool
      : pool.filter(function(e){ return statusOf(e) === state.filter; });
    var groups = groupBy(entries);
    var keys = groupKeys(groups);
    document.getElementById("statWatching").textContent = live.filter(function(e){ return statusOf(e) === "watching"; }).length;
    document.getElementById("statDone").textContent = live.filter(function(e){ return statusOf(e) === "done"; }).length;
    document.getElementById("statTotal").textContent = live.length;
    var ranked = live.filter(function(e){ return typeof e.rank === "number"; });
    document.getElementById("statAvg").textContent = ranked.length
      ? (ranked.reduce(function(s,e){return s+e.rank;},0) / ranked.length).toFixed(1)
      : "–";

    if (!keys.length){
      var msg;
      if (!live.length) msg = "Nothing logged yet — add your first title.";
      else if (!pool.length) msg = "No titles match your search.";
      else msg = "Nothing is \u201C" + statusLabel(state.filter) + "\u201D" +
        (state.search.trim() ? " in this search." : " yet.");
      container.innerHTML = '<div class="empty-state">' + escapeHtml(msg) + '</div>';
      return;
    }

    container.innerHTML = keys.map(function(key){
      var gs = getGroupState(key);
      var list = sortEntries(groups[key], gs);
      var rowsHtml = list.map(rowHtml).join("");
      var options = SORT_FIELDS.map(function(f){
        return '<option value="'+f.key+'"'+(f.key===gs.sortKey?' selected':'')+'>'+f.label+'</option>';
      }).join("");
      return (
        '<section class="group'+(gs.collapsed?' collapsed':'')+'" data-group="'+escapeHtml(key)+'">' +
          '<div class="group-head">' +
            '<button type="button" class="name" data-action="toggle-group">'+chevIcon()+escapeHtml(key)+'</button>' +
            '<span class="count">'+list.length+'</span>' +
            '<div class="sort-controls">' +
              '<select data-action="sort-key" aria-label="Sort '+escapeHtml(key)+' by">'+options+'</select>' +
              '<button type="button" class="sort-dir'+(gs.sortDir==='desc'?' desc':'')+'" data-action="sort-dir" title="Toggle sort direction">'+arrowIcon()+'</button>' +
            '</div>' +
          '</div>' +
          '<div class="rows">'+ (rowsHtml || '<div class="empty-state small">No titles in this group.</div>') +'</div>' +
        '</section>'
      );
    }).join("");
  }

  function progressHtml(e){
    var total = numOrNull(e.episodesTotal);
    if (!total) return "";
    var seen = numOrNull(e.episodesWatched) || 0;
    var pct = Math.max(0, Math.min(100, Math.round(seen / total * 100)));
    return '<span class="progress"><span class="bar"><i style="width:'+pct+'%"></i></span>'+seen+'/'+total+'</span>';
  }

  // The date worth showing depends on where the title is: when it ended, or when it started.
  function dateStub(e){
    var st = statusOf(e);
    if (st !== "watching" && e.watchedDate) return "Fin " + fmtDate(e.watchedDate);
    if (e.startedDate) return "Since " + fmtDate(e.startedDate);
    if (e.watchedDate) return "Fin " + fmtDate(e.watchedDate);
    return "—";
  }

  function rowHtml(e){
    var st = statusOf(e);
    var chips = [];
    if (e.genre) chips.push('<span class="chip">'+escapeHtml(e.genre)+'</span>');
    var prog = progressHtml(e);
    if (prog) chips.push(prog);
    var rankHtml = typeof e.rank === "number"
      ? '<span class="rank">'+starIcon()+e.rank.toFixed(1)+'</span>'
      : '<span class="rank empty">—</span>';
    return (
      '<div class="row st-'+st+'" data-id="'+e.id+'">' +
        '<button type="button" class="status-btn" data-action="cycle-status" aria-label="Status: '+statusLabel(st)+'. Click for the next one."><span class="dot"></span>'+statusLabel(st)+'</button>' +
        '<div class="info" data-action="edit">' +
          '<div class="title">'+escapeHtml(e.title)+'</div>' +
          '<div class="meta">'+chips.join("")+'</div>' +
          (e.notes ? '<div class="notes-preview">'+escapeHtml(e.notes)+'</div>' : '') +
        '</div>' +
        '<div class="divider"></div>' +
        '<div class="stub">' +
          '<span class="dates">'+dateStub(e)+'</span>' +
          rankHtml +
        '</div>' +
        '<div class="row-actions">' +
          '<button type="button" class="icon-btn" data-action="edit" aria-label="Edit"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>' +
        '</div>' +
      '</div>'
    );
  }

  // ---------- events ----------
  document.getElementById("groups").addEventListener("change", function(ev){
    var actionEl = ev.target.closest("[data-action]");
    if (!actionEl || actionEl.getAttribute("data-action") !== "sort-key") return;
    var groupEl = ev.target.closest(".group");
    var key = groupEl.getAttribute("data-group");
    getGroupState(key).sortKey = actionEl.value;
    viewSave();
    render();
  });

  document.getElementById("groups").addEventListener("click", function(ev){
    var actionEl = ev.target.closest("[data-action]");
    if (!actionEl) return;
    var groupEl = ev.target.closest(".group");
    var rowEl = ev.target.closest(".row");
    var action = actionEl.getAttribute("data-action");

    if (action === "toggle-group"){
      var key = groupEl.getAttribute("data-group");
      var gs = getGroupState(key);
      gs.collapsed = !gs.collapsed;
      viewSave();
      render();
    } else if (action === "sort-dir"){
      var key3 = groupEl.getAttribute("data-group");
      var gs3 = getGroupState(key3);
      gs3.sortDir = gs3.sortDir === "asc" ? "desc" : "asc";
      viewSave();
      render();
    } else if (action === "cycle-status"){
      var id = rowEl.getAttribute("data-id");
      var e = state.entries.find(function(x){return x.id===id;});
      if (e){
        applyStatus(e, STATUSES[(STATUS_INDEX[statusOf(e)] + 1) % STATUSES.length].key);
        touch(e);
        render();
        sync.save();
      }
    } else if (action === "edit"){
      var id2 = rowEl.getAttribute("data-id");
      var e2 = state.entries.find(function(x){return x.id===id2;});
      openModal(e2);
    }
  });

  document.getElementById("statusFilters").addEventListener("click", function(ev){
    var chip = ev.target.closest("[data-filter]");
    if (!chip) return;
    state.filter = chip.getAttribute("data-filter");
    viewSave();
    render();
  });

  document.getElementById("groupBySelect").addEventListener("change", function(ev){
    state.groupBy = ev.target.value;
    viewSave();
    render();
  });

  document.getElementById("searchInput").addEventListener("input", function(ev){
    state.search = ev.target.value;
    render();
  });
  document.getElementById("addBtn").addEventListener("click", function(){ openModal(null); });
  document.getElementById("refreshBtn").addEventListener("click", function(){ sync.load().then(render); });
  document.getElementById("syncSettingsBtn").addEventListener("click", openSyncModal);

  // ---------- modal ----------
  function openModal(entry){
    var tpl = document.getElementById("modalTemplate");
    var node = tpl.content.cloneNode(true);
    document.body.appendChild(node);
    var overlay = document.getElementById("overlay");

    var isEdit = !!entry;
    document.getElementById("modalTitle").textContent = isEdit ? "Edit title" : "Add title";
    document.getElementById("deleteBtn").style.display = isEdit ? "inline-flex" : "none";

    var rankValue = (isEdit && typeof entry.rank === "number") ? entry.rank : null;
    renderStarPicker(document.getElementById("f-rank-picker"),
      function(){ return rankValue; },
      function(v){ rankValue = v; });

    if (isEdit){
      document.getElementById("f-title").value = entry.title || "";
      document.getElementById("f-mediaType").value = entry.mediaType || "";
      document.getElementById("f-genre").value = entry.genre || "";
      document.getElementById("f-status").value = statusOf(entry);
      document.getElementById("f-epWatched").value = entry.episodesWatched == null ? "" : entry.episodesWatched;
      document.getElementById("f-epTotal").value = entry.episodesTotal == null ? "" : entry.episodesTotal;
      document.getElementById("f-startedDate").value = entry.startedDate || "";
      document.getElementById("f-watchedDate").value = entry.watchedDate || "";
      document.getElementById("f-notes").value = entry.notes || "";
    }

    function close(){ overlay.remove(); }
    document.getElementById("cancelBtn").addEventListener("click", close);
    overlay.addEventListener("click", function(ev){ if (ev.target === overlay) close(); });
    document.addEventListener("keydown", function esc(ev){
      if (ev.key === "Escape"){ close(); document.removeEventListener("keydown", esc); }
    });

    document.getElementById("deleteBtn").addEventListener("click", function(){
      entry.deletedAt = nowISO();
      touch(entry);
      close();
      render();
      sync.save();
      toast("Deleted");
    });

    document.getElementById("entryForm").addEventListener("submit", function(ev){
      ev.preventDefault();
      var data = {
        title: document.getElementById("f-title").value.trim(),
        mediaType: document.getElementById("f-mediaType").value.trim(),
        genre: document.getElementById("f-genre").value.trim(),
        startedDate: document.getElementById("f-startedDate").value,
        watchedDate: document.getElementById("f-watchedDate").value,
        episodesWatched: numOrNull(document.getElementById("f-epWatched").value),
        episodesTotal: numOrNull(document.getElementById("f-epTotal").value),
        rank: rankValue,
        notes: document.getElementById("f-notes").value.trim()
      };
      if (!data.title) return;
      var statusValue = document.getElementById("f-status").value;
      if (isEdit){
        Object.assign(entry, data);
        applyStatus(entry, statusValue);
        touch(entry);
      } else {
        data.id = uid();
        applyStatus(data, statusValue);
        touch(data);
        state.entries.push(data);
      }
      close();
      render();
      sync.save();
      toast(isEdit ? "Saved" : "Added");
    });

    setTimeout(function(){ document.getElementById("f-title").focus(); }, 0);
  }

  // ---------- boot ----------
  (async function boot(){
    viewLoad();
    document.getElementById("groupBySelect").innerHTML = GROUP_FIELDS.map(function(f){
      return '<option value="' + f.key + '">' + f.label + '</option>';
    }).join("");
    var ok = sync.init();
    if (ok){
      await sync.load();
    } else {
      state.entries = purgeTombstones(localLoad() || []);
      setSync("warn", "Local only", noteRetry("Connect GitHub to sync across devices.", openSyncModal, "Connect"), false);
    }
    render();
  })();

})();
</script>
